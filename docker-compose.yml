services:
  immich-booster:
    # Fertiges Image von GHCR - oeffentlich, kein Login noetig.
    # Zum Selbstbauen die naechste Zeile auskommentieren und "build" aktivieren.
    image: ghcr.io/randomname653/immich-booster:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: immich-booster
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - TZ=${TZ:-Europe/Berlin}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    volumes:
      # Arbeitsverzeichnis: haelt pro Video kurzzeitig Original und Ergebnis.
      # Bei 4K-Quellen sollten hier einige GB frei sein.
      - ./temp:/app/temp
      # Merkliste der bearbeiteten Videos - unbedingt persistent halten,
      # sonst faengt der Dienst nach einem Neustart von vorne an.
      - ./config:/app/config
    restart: unless-stopped
